    <script>
      // Apply theme before paint to avoid FOUC. ?theme=light|dark deep-links a
      // theme (docs screenshots, demos) and persists it like the toggle would.
      (function () {
        try {
          var forced = new URLSearchParams(window.location.search).get("theme");
          if (forced === "light" || forced === "dark") {
            localStorage.setItem("aigenos-flow-theme", forced);
          }
          // Light is the product default; dark is opt-in via the toggle.
          var theme = localStorage.getItem("aigenos-flow-theme") || "light";
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
