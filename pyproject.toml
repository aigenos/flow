# Root-level project metadata.
#
# Each of `engine/`, `backend/`, `frontend/` is also independently
# installable from its own folder — this file exists so that:
#
#   1. `pytest` invoked from the repo root collects engine + backend tests
#      cleanly. Without it, the two `tests/` packages with overlapping
#      filenames (`test_loader.py`) clash on import. We use rootdir mode
#      (importmode = "importlib") so pytest uses the file path as the
#      module identity rather than dotted package names.
#
#   2. Tools that look at the repo root (Renovate, dependabot, codeQL,
#      `pip-audit`) have one place to start from.
#
# The actual install metadata still lives in each subpackage's
# `pyproject.toml`. Do NOT add dependencies here.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
# importlib mode: every test file is its own importable module by path.
# Avoids the `tests.test_loader` collision between engine and backend.
addopts = "--import-mode=importlib"
