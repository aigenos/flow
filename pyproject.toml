# Root-level project metadata.
#
# `backend/` (pip) and `frontend/` (npm) are each installable from their own
# folder. This file exists so that:
#
#   1. `pytest` invoked from the repo root runs the whole suite: the engine
#      tests (backend/tests/flow/) and the server tests (backend/tests/).
#      importlib mode makes each test file's path its module identity, so two
#      test files with the same name in different folders cannot clash.
#
#   2. Tools that look at the repo root (Renovate, dependabot, codeQL,
#      `pip-audit`) have one place to start from.
#
# The actual install metadata still lives in each subpackage's
# `pyproject.toml`. Do NOT add dependencies here.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
# importlib mode: every test file is its own importable module by path.
# Avoids the `tests.test_loader` collision between engine and backend.
addopts = "--import-mode=importlib"
